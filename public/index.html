<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Template Creator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>APTRANSCO WhatsApp Template Creator</h1>
  <p><a href="/groups.html">View WhatsApp Groups &amp; Contacts &rarr;</a></p>
  <p><a href="/template-status.html">View Template Status &rarr;</a></p>

  <div class="source-toggle">
    <label><input type="radio" name="source" value="builtin" checked /> Use built-in list (templates.js)</label>
    <label><input type="radio" name="source" value="upload" /> Upload custom JSON file</label>
  </div>
  <div id="uploadSection" class="upload-section" hidden>
    <input type="file" id="fileInput" accept="application/json,.json" />
    <button id="loadFileBtn">Load Templates</button>
    <span id="uploadStatus"></span>
  </div>

  <div class="controls">
    <button id="startBtn">Start Creating Templates</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <p id="log"></p>
  <p id="countdown"></p>
  <table id="table">
    <thead>
      <tr><th>#</th><th>Template</th><th>Status</th><th>Detail</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="summary"></div>
  <script src="/app.js"></script>
</body>
</html>
