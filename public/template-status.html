<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Templates</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="wide">
  <h1>All WhatsApp Templates</h1>
  <p><a href="/">&larr; Back to Template Creator</a></p>

  <div class="controls">
    <button id="refreshBtn">Refresh</button>
    <input type="search" id="searchInput" placeholder="Search by template name..." />
  </div>
  <p id="log"></p>
  <table id="table">
    <thead>
      <tr><th>#</th><th>Template</th><th>Category</th><th>Status</th><th>Body</th><th>Language</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <script src="/template-status.js"></script>
</body>
</html>
